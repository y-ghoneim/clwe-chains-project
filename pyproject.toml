[project]
name = "clwe-chains"
version = "0.1.0"
description = "Can a language graph pick intermediate-language chains that beat direct cross-lingual word embedding alignment for distant pairs?"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7",
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "nltk>=3.9",
    "anyascii>=0.3",
    "rapidfuzz>=3.9",
    "lang2vec>=1.1",
    "pytorch-crf>=0.7.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clwe_chains"]

# CUDA build of PyTorch (Ada GPUs such as the RTX 4050 and RTX 4500 work with cu128).
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs CUDA", "data: needs the real inputs under data_root"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["analyses"]  # one-off records, never edited after they have run

[tool.ruff.lint]
extend-select = ["E501"]  # enforce the 100-character line length (CLAUDE.md)
